<!DOCTYPE html>
<html lang="uz">
<head>
  <script>document.documentElement.classList.add('has-intro');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taqdimotlar</title>
  <meta name="description" content="Universitet uchun HTML taqdimotlar to'plami. slides.async-boy.uz" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%234f46e5%22/><text x=%2250%22 y=%2269%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>A</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>

  <style>
    html { -webkit-text-size-adjust: 100%; }
    body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    .card { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .card:hover { transform: translateY(-2px); }

    /* Intro: logo markazda, keyin navbarga o'tadi */
    main, footer { transition: opacity .6s ease; }
    html.has-intro main,
    html.has-intro footer { opacity: 0; }
    #nav-link { transition: opacity .6s ease, color .15s ease; }
    html.has-intro #nav-link { opacity: 0; }

    /* Markazda turganda: harflar chapdan o'ngga bo'yaladi va kattalashadi */
    @keyframes brand-letter {
      0%        { color: #cbd5e1; transform: translateY(0) scale(1); }
      12%       { color: #4f46e5; transform: translateY(-0.12em) scale(1.45); }
      32%       { color: #4f46e5; transform: translateY(0) scale(1.12); }
      60%, 100% { color: #cbd5e1; transform: translateY(0) scale(1); }
    }
    html.has-intro #brand-inner .ltr {
      display: inline-block;
      color: #cbd5e1;
      animation: brand-letter 1.3s ease-in-out infinite;
      animation-delay: calc(var(--i) * 0.075s);
    }
  </style>
  <noscript><style>#brand { visibility: visible !important; }</style></noscript>
</head>

<body class="min-h-screen bg-white font-sans text-slate-900 antialiased">

  <!-- Header -->
  <header class="border-b border-slate-100">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
      <a href="./" id="brand" class="flex items-center gap-2.5" style="visibility: hidden; will-change: transform;">
        <span id="brand-inner" class="text-sm font-semibold tracking-tight"><span class="ltr text-slate-900" style="--i:0">a</span><span class="ltr text-slate-900" style="--i:1">s</span><span class="ltr text-slate-900" style="--i:2">y</span><span class="ltr text-slate-900" style="--i:3">n</span><span class="ltr text-slate-900" style="--i:4">c</span><span class="ltr text-indigo-600" style="--i:5">s</span><span class="ltr text-indigo-600" style="--i:6">l</span><span class="ltr text-indigo-600" style="--i:7">i</span><span class="ltr text-indigo-600" style="--i:8">d</span><span class="ltr text-indigo-600" style="--i:9">e</span><span class="ltr text-indigo-600" style="--i:10">s</span></span>
      </a>
      <a href="https://async-boy.uz" id="nav-link"
         class="text-sm text-slate-400 hover:text-slate-900">
        async-boy.uz
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-6">

    <!-- Hero -->
    <section class="py-16 sm:py-20">
      <h1 class="text-4xl font-bold tracking-tight text-slate-900 sm:text-5xl">Taqdimotlar</h1>
      <p class="mt-3 text-slate-500">Universitet uchun HTML taqdimotlar.</p>
    </section>

    <!-- Roster -->
    <section class="pb-20">
      <div class="mb-6 border-t border-slate-100 pt-6">
        <p id="deck-status" class="text-sm text-slate-400">Yuklanmoqda…</p>
      </div>

      <div id="deck-grid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>

      <noscript>
        <p class="rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800">
          Taqdimotlar ro'yxatini ko'rish uchun JavaScript'ni yoqing.
        </p>
      </noscript>
    </section>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-100">
    <div class="mx-auto max-w-6xl px-6 py-8 text-sm text-slate-400">
      <p><span>&copy;</span> <span id="year">2026</span> async-boy.uz</p>
    </div>
  </footer>

  <script src="presentations.js"></script>
  <script src="assets/app.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>

  <script>
    /* Intro animatsiyasi: logo markazda katta -> 5 soniyadan so'ng navbarga joylashadi. */
    (function () {
      var brand = document.getElementById('brand');
      if (!brand) return;

      var root = document.documentElement;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function reveal() { root.classList.remove('has-intro'); }

      if (reduce) {
        brand.style.transform = 'none';
        brand.style.visibility = 'visible';
        reveal();
        return;
      }

      var rect = brand.getBoundingClientRect();
      var dx = window.innerWidth / 2 - (rect.left + rect.width / 2);
      var dy = window.innerHeight / 2 - (rect.top + rect.height / 2);
      var scale = 3.2;

      brand.style.transformOrigin = 'center center';
      brand.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + scale + ')';
      brand.style.transition = 'opacity 700ms ease';
      brand.style.opacity = '0';
      brand.style.visibility = 'visible';
      requestAnimationFrame(function () { brand.style.opacity = '1'; });

      setTimeout(function () {
        brand.style.transition = 'transform 900ms cubic-bezier(.22,.7,.24,1)';
        requestAnimationFrame(function () { brand.style.transform = 'none'; });
        reveal();
        setTimeout(function () {
          brand.style.transition = '';
          brand.style.transformOrigin = '';
          brand.style.opacity = '';
          brand.style.willChange = '';
        }, 950);
      }, 5000);
    })();
  </script>
</body>
</html>
