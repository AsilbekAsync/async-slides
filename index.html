<!DOCTYPE html>
<html lang="uz">
<head>
  <script>document.documentElement.classList.add('has-intro');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taqdimotlar</title>
  <meta name="description" content="Universitet uchun HTML taqdimotlar to'plami. slides.async-boy.uz" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%234f46e5%22/><text x=%2250%22 y=%2269%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>A</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/app.css" />
  <noscript><style>#brand { visibility: visible !important; }</style></noscript>
</head>

<body class="min-h-screen bg-white font-sans text-slate-900 antialiased">

  <!-- Intro overlay (dekorativ) -->
  <div id="intro" aria-hidden="true">
    <div id="intro-word">
      <span class="g-ltr" style="--i:0">a</span><span class="g-ltr" style="--i:1">s</span><span class="g-ltr" style="--i:2">y</span><span class="g-ltr" style="--i:3">n</span><span class="g-ltr" style="--i:4">c</span><span class="g-ltr" style="--i:5">s</span><span class="g-ltr" style="--i:6">l</span><span class="g-ltr" style="--i:7">i</span><span class="g-ltr" style="--i:8">d</span><span class="g-ltr" style="--i:9">e</span><span class="g-ltr" style="--i:10">s</span>
    </div>
  </div>
  <div id="intro-progress" aria-hidden="true"><span class="bar"></span></div>

  <!-- Header -->
  <header class="border-b border-slate-100">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
      <a href="./" id="brand" class="flex items-center gap-2.5" style="visibility: hidden;">
        <span id="brand-inner"><span class="ltr" style="color:#0f172a">a</span><span class="ltr" style="color:#0f172a">s</span><span class="ltr" style="color:#0f172a">y</span><span class="ltr" style="color:#0f172a">n</span><span class="ltr" style="color:#0f172a">c</span><span class="ltr" style="color:#4f46e5">s</span><span class="ltr" style="color:#4f46e5">l</span><span class="ltr" style="color:#4f46e5">i</span><span class="ltr" style="color:#4f46e5">d</span><span class="ltr" style="color:#4f46e5">e</span><span class="ltr" style="color:#4f46e5">s</span></span>
      </a>
      <a href="https://async-boy.uz" id="nav-link"
         class="text-sm text-slate-400 hover:text-slate-900">
        async-boy.uz
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-6">

    <!-- Hero -->
    <section class="py-16 sm:py-20">
      <h1 class="reveal text-4xl font-bold tracking-tight text-slate-900 sm:text-5xl">Taqdimotlar</h1>
      <p class="reveal mt-3 text-slate-500">Universitet uchun HTML taqdimotlar.</p>
    </section>

    <!-- Roster -->
    <section class="pb-20">
      <div class="reveal mb-6 border-t border-slate-100 pt-6">
        <p id="deck-status" class="text-sm text-slate-400">Yuklanmoqda…</p>
      </div>

      <div id="deck-grid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>

      <noscript>
        <p class="rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800">
          Taqdimotlar ro'yxatini ko'rish uchun JavaScript'ni yoqing.
        </p>
      </noscript>
    </section>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-100">
    <div class="mx-auto max-w-6xl px-6 py-8 text-sm text-slate-400">
      <p class="reveal"><span>&copy;</span> <span id="year">2026</span> async-boy.uz</p>
    </div>
  </footer>

  <script src="presentations.js"></script>
  <script src="assets/app.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>

  <script>
    /*
     * Intro: markazda katta matn -> kutish (pastda progress) -> navbarga qaytish.
     * Faqat index.html; tashqi kutubxonasiz.
     */
    (function () {
      var intro = document.getElementById('intro');
      var progress = document.getElementById('intro-progress');
      var brand = document.getElementById('brand');
      if (!intro || !brand) return;

      var root = document.documentElement;
      var word = document.getElementById('intro-word');
      var gl = Array.prototype.slice.call(intro.querySelectorAll('.g-ltr'));
      var targets = Array.prototype.slice.call(brand.querySelectorAll('.ltr'));

      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var WAIT = 5000;      // markazda kutish (ms)
      var STAGGER = 45;     // harflar orasidagi kechikish (ms)

      function reveal() {
        root.classList.remove('has-intro');
        var els = document.querySelectorAll('.reveal');
        Array.prototype.forEach.call(els, function (el, i) {
          el.style.transitionDelay = (i * 70) + 'ms';
          el.classList.add('in');
        });
        window.setTimeout(function () {
          Array.prototype.forEach.call(els, function (el) { el.style.transitionDelay = ''; });
        }, 800 + els.length * 70);
      }

      function cleanup() {
        brand.style.visibility = 'visible';
        if (intro.parentNode) intro.parentNode.removeChild(intro);
        if (progress && progress.parentNode) progress.parentNode.removeChild(progress);
      }

      function fallback() {
        cleanup();
        reveal();
      }

      if (reduce) { fallback(); return; }

      function start() {
        if (progress) {
          progress.classList.add('is-visible');
          progress.classList.add('is-run');   // 5s davomida to'ladi
        }
        // Chapdan o'ngga paydo bo'lish
        gl.forEach(function (l, i) {
          window.setTimeout(function () {
            l.style.opacity = '1';
            l.style.transform = 'none';
          }, i * STAGGER);
        });
        // Rang: async -> qora, slides -> indigo (chapdan o'ngga)
        gl.forEach(function (l, i) {
          window.setTimeout(function () {
            l.style.color = i < 5 ? '#0f172a' : '#4f46e5';
          }, 650 + i * 40);
        });
      }

      // Har bir harfni navbardagi joyiga alohida uchirish (FLIP).
      function flight() {
        var tRects = targets.map(function (t) { return t.getBoundingClientRect(); });
        var totalDelay = 0;

        gl.forEach(function (l, i) {
          var r = l.getBoundingClientRect();
          var t = tRects[i] || r;
          var sc = r.width ? (t.width / r.width) : 1;
          var tx = (t.left + t.width / 2) - (r.left + r.width / 2);
          var ty = (t.top + t.height / 2) - (r.top + r.height / 2);
          var delay = i * STAGGER;
          totalDelay = Math.max(totalDelay, delay);
          l.style.transition = 'transform 720ms cubic-bezier(.34,1.28,.42,1) ' + delay + 'ms';
          l.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + sc + ')';
        });

        return totalDelay;
      }

      function run() {
        try { start(); } catch (e) { fallback(); return; }

        window.setTimeout(function () {
          if (progress) progress.classList.remove('is-visible');

          var totalDelay;
          try { totalDelay = flight(); } catch (e) { fallback(); return; }

          window.setTimeout(reveal, totalDelay + 320);
          window.setTimeout(cleanup, totalDelay + 800);
        }, WAIT);
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(run).catch(run);
      } else {
        run();
      }

      // Xavfsizlik tarmog'i
      window.setTimeout(function () {
        if (brand.style.visibility !== 'visible') { cleanup(); reveal(); }
      }, WAIT + 4000);
    })();
  </script>
</body>
</html>
